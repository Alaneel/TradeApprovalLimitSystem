version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: trading-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: trading_system
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILE=prod
      - MONGODB_URI=mongodb://mongodb:27017/trading_system
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: trading-frontend
    restart: unless-stopped
    environment:
      - BACKEND_API_URL=http://backend:8080
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
